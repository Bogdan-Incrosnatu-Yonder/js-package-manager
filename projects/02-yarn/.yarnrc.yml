# Yarn 4 (Berry) configuration.
# Docs: https://yarnpkg.com/configuration/yarnrc

# The Yarn 4 release is committed to .yarn/releases, so `yarn` works even if
# Corepack is unavailable or blocked by a corporate proxy.
yarnPath: .yarn/releases/yarn-4.18.0.cjs

# node-modules keeps Angular CLI, Karma and PrimeNG on the well-trodden path.
# Switch to "pnp" for the zero-install exercise in the project README — expect
# to need the @yarnpkg/sdks step for editor support.
nodeLinker: node-modules

# Show what is actually happening during install.
enableInlineBuilds: false
enableTelemetry: false

# Yarn disables build scripts by default. These four need them.
enableScripts: true
